server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los assets con hash en el nombre (JS/CSS de Vite) pueden cachearse
    # agresivamente: si cambia el contenido, cambia el nombre del archivo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta que no sea un archivo real la resuelve React Router
    # del lado del cliente contra index.html. index.html en si no se cachea,
    # para que un deploy nuevo se vea sin esperar la expiracion de una cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
